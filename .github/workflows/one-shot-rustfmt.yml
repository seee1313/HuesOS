name: One-shot Rust formatting

on:
  push:
    branches:
      - arena/6c8dfed6-huesos

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust formatter
        run: |
          rustup toolchain install nightly-2026-03-01 --profile minimal --component rustfmt
          rustup default nightly-2026-03-01
      - name: Format repository
        run: python3 tools/fmt-all.py
      - name: Commit formatted sources
        run: |
          if git diff --quiet; then
            echo "Rust sources are already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format Rust sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"
