name: HuesOS hardening

on:
  push:
    branches: [main, "huesos-dev/**", "huesos-dev-**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly-2026-03-01 --profile minimal \
            --component rust-src,rustfmt,clippy,llvm-tools-preview
          rustup default nightly-2026-03-01
      - name: Enforce safety, lock, alloc-free and formatting policies
        run: make audit-check
      - name: Clippy
        env:
          CARGO_BUILD_JOBS: "1"
        run: make clippy
      - name: Host tests
        env:
          CARGO_BUILD_JOBS: "1"
        run: make test

  qemu-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
        cpus: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc xorriso qemu-system-x86
      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly-2026-03-01 --profile minimal \
            --component rust-src,llvm-tools-preview
          rustup default nightly-2026-03-01
      - name: Boot QEMU
        env:
          CARGO_BUILD_JOBS: "1"
          ARTIFACT_DIR: ci-artifacts
        run: bash scripts/ci-qemu-smoke.sh ${{ matrix.profile }} ${{ matrix.cpus }} 120
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ matrix.profile }}-smp${{ matrix.cpus }}
          path: ci-artifacts/
          if-no-files-found: warn

  qemu-nvme-boot:
    # End-to-end NVMe DriverHost + hxfs-service smoke. Boots QEMU with a
    # real -device nvme,serial=huesosnvme backed by a 4 GiB Hxfs v5
    # image produced by `tools/mkhxfs.py`. The expected happy path is
    # `controller identify` -> `VolumeManager system volume` ->
    # `[hxfs] service started` without `journal replay failed: BadBlock`
    # and without `controller bring-up failed`.
    #
    # Matrix mirrors `qemu-boot` so a release/LTO regression in the
    # storage path surfaces here even if the no-NVMe boot smoke is
    # green. The default 120 s timeout is generous for the bring-up
    # path; the soak variant uses a longer wall clock.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
        cpus: [2]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc xorriso qemu-system-x86
      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly-2026-03-01 --profile minimal \
            --component rust-src,llvm-tools-preview
          rustup default nightly-2026-03-01
      - name: NVMe + Hxfs QEMU smoke
        env:
          CARGO_BUILD_JOBS: "1"
          ARTIFACT_DIR: ci-artifacts
        run: bash scripts/ci-qemu-nvme-soak.sh ${{ matrix.profile }} 120
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-nvme-${{ matrix.profile }}-smp${{ matrix.cpus }}
          path: ci-artifacts/
          if-no-files-found: warn

  qemu-nvme-gcm-inject:
    # Stage B.5: the encrypted+compressed I/O pipeline on target,
    # with fault injection. The soak harness builds the ISO with
    # HUESOS_HXFS_SERVICE_FEATURES=synthetic-key, seeds a volume
    # that carries an encrypted+compressed seed file, flips one bit
    # of the seed file's GCM ciphertext, and asserts that the
    # on-target boot self-check reports `[hxfs] bad-gcm-tag-marked`
    # and `[hxfs] odirect-deny-ok` while the service keeps serving.
    # This is the CI proof of the Stage B exit criterion: a
    # corrupted extent is rejected with the precise error, not a
    # panic, and the mount survives.
    #
    # The 4th soak argument switches injection mode; the default
    # qemu-nvme-boot job keeps the plain-volume path.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [release]
        cpus: [2]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc xorriso qemu-system-x86
      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly-2026-03-01 --profile minimal \
            --component rust-src,llvm-tools-preview
          rustup default nightly-2026-03-01
      - name: NVMe + Hxfs GCM injection QEMU smoke
        env:
          CARGO_BUILD_JOBS: "1"
          ARTIFACT_DIR: ci-artifacts
        run: bash scripts/ci-qemu-nvme-soak.sh ${{ matrix.profile }} 180 ci-artifacts/qemu-nvme-gcm-inject.log 1
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-nvme-gcm-inject-${{ matrix.profile }}-smp${{ matrix.cpus }}
          path: ci-artifacts/
          if-no-files-found: warn

  qemu-nvme-crc-inject:
    # Stage C: the compressed-payload CRC32C path on target, with
    # fault injection. The soak harness builds the ISO with
    # HUESOS_HXFS_SERVICE_FEATURES=synthetic-key, seeds a PLAIN
    # volume whose compressed seed file has one payload byte
    # flipped, and asserts the on-target markers: bad-checksum-marked
    # (not a panic), extent-bad-marked, plus the Stage C reliability
    # probes (scrub complete / fsck clean / quota-enforced-ok).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [release]
        cpus: [2]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc xorriso qemu-system-x86
      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly-2026-03-01 --profile minimal \
            --component rust-src,llvm-tools-preview
          rustup default nightly-2026-03-01
      - name: NVMe + Hxfs CRC injection QEMU smoke
        env:
          CARGO_BUILD_JOBS: "1"
          ARTIFACT_DIR: ci-artifacts
        run: bash scripts/ci-qemu-nvme-soak.sh ${{ matrix.profile }} 180 ci-artifacts/qemu-nvme-crc-inject.log 2
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-nvme-crc-inject-${{ matrix.profile }}-smp${{ matrix.cpus }}
          path: ci-artifacts/
          if-no-files-found: warn

  qemu-nvme-shutdown-cycle:
    # Integration gate (roadmap goal): boot -> encrypted volume ->
    # workload (4 MiB file) -> graceful userspace shutdown -> all
    # CPUs halted. The soak harness builds with the synthetic key and
    # the terminal soak-shutdown feature, waits for the halt marker
    # instead of a timeout kill, and requires the full shutdown
    # chain markers.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [release]
        cpus: [2]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc xorriso qemu-system-x86 socat
      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly-2026-03-01 --profile minimal \
            --component rust-src,llvm-tools-preview
          rustup default nightly-2026-03-01
      - name: NVMe + Hxfs graceful-shutdown QEMU smoke
        env:
          CARGO_BUILD_JOBS: "1"
          ARTIFACT_DIR: ci-artifacts
        run: bash scripts/ci-qemu-nvme-soak.sh ${{ matrix.profile }} 180 ci-artifacts/qemu-nvme-shutdown-cycle.log 3
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-nvme-shutdown-cycle-${{ matrix.profile }}-smp${{ matrix.cpus }}
          path: ci-artifacts/
          if-no-files-found: warn

  qemu-extable-smoke:
    # Boot QEMU with an HBI cmdline that asks the kernel to fire the
    # synthetic recoverable-copy probe, then verify the serial log
    # contains the "recovered" marker. This is the CI proof that the
    # extable populate + wire-up actually redirects a ring-0 #PF to
    # the fixup landing pad — the exact class of failure the earlier
    # extable attempt (651cc1c revert) shipped without a target-side
    # test and had to roll back.
    #
    # Matrix intentionally covers both profiles so a release/LTO
    # regression (the historical failure mode) surfaces here even if
    # the debug boot smoke is green. smp=2 exercises the same CPL0
    # #PF handler on both cores.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc xorriso qemu-system-x86
      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly-2026-03-01 --profile minimal \
            --component rust-src,llvm-tools-preview
          rustup default nightly-2026-03-01
      - name: Extable smoke (synthetic recoverable-copy probe)
        env:
          CARGO_BUILD_JOBS: "1"
          ARTIFACT_DIR: ci-artifacts
        run: bash scripts/ci-qemu-extable-smoke.sh ${{ matrix.profile }} 2 120
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-extable-${{ matrix.profile }}-smp2
          path: ci-artifacts/
          if-no-files-found: warn
