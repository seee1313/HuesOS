name: lab-rust

# TEMPORARY (this branch only): pack a Rust toolchain on a runner and publish it
# to a throwaway branch, because this sandbox cannot reach static.rust-lang.org
# (to install) nor the artifact blob host (to download).
#
# The job runs inside an Ubuntu 22.04 container so the toolchain binaries link
# against glibc 2.35: the sandbox has 2.36, a 24.04 runner would produce
# binaries that need 2.38/2.39 and a hand-patched symbol shim (the QEMU detour
# of the previous round).
on:
  workflow_dispatch:
  push:
    branches: ["arena/14dbccbc-huesos"]

permissions:
  contents: write

concurrency:
  group: lab-rust
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 60
    steps:
      - name: Base tooling
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl ca-certificates git zstd xz-utils build-essential gcc
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned nightly
        run: |
          set +e
          # The container runs as root but the runner exports HOME=/github/home;
          # rustup refuses the mismatch, so pin HOME for every step that touches
          # the toolchain.
          export HOME=/root
          (
            curl -sSf https://sh.rustup.rs -o /tmp/rustup.sh &&
            sh /tmp/rustup.sh -y --profile minimal --default-toolchain none &&
            . "$HOME/.cargo/env" &&
            rustup toolchain install nightly-2026-03-01 --profile minimal               --component rust-src,clippy,rustfmt &&
            rustc -vV
          ) > /tmp/install.log 2>&1
          status=$?
          message=$(tail -c 3000 /tmp/install.log | tr '\n' '|' | sed 's/%/%25/g')
          echo "::error title=install-status::exit ${status}"
          echo "::error title=install-log::${message}"
          exit "$status"
      - name: Pack it
        run: |
          set +e
          export HOME=/root
          (
            set -x
            df -h /root /tmp
            TC="$HOME/.rustup/toolchains/nightly-2026-03-01-x86_64-unknown-linux-gnu"
            rm -rf "$TC/share/doc" "$TC/share/man" "$TC/lib/rustlib/etc" \
              "$TC/lib/rustlib/components"
            du -sh "$TC"
            tar -C "$HOME/.rustup/toolchains" -cf /tmp/lab-rust.tar \
              nightly-2026-03-01-x86_64-unknown-linux-gnu
            zstd -3 -T0 -f /tmp/lab-rust.tar -o /tmp/lab-rust.tar.zst
            rm -f /tmp/lab-rust.tar
            tar -C "$HOME/.cargo" -cf /tmp/lab-cargo-bin.tar bin
            zstd -3 -T0 -f /tmp/lab-cargo-bin.tar -o /tmp/lab-cargo-bin.tar.zst
            rm -f /tmp/lab-cargo-bin.tar
            ls -l /tmp/lab-rust.tar.zst /tmp/lab-cargo-bin.tar.zst
          ) > /tmp/pack.log 2>&1
          status=$?
          message=$(tail -c 3000 /tmp/pack.log | tr '\n' '|' | sed 's/%/%25/g')
          echo "::error title=pack-status::exit ${status}"
          echo "::error title=pack-log::${message}"
          exit "$status"
      - name: Publish to a throwaway branch
        run: |
          set +e
          export HOME=/root
          (
            set -x
            mkdir -p /tmp/lab/parts
            split -b 20M /tmp/lab-rust.tar.zst /tmp/lab/parts/rust-
            split -b 20M /tmp/lab-cargo-bin.tar.zst /tmp/lab/parts/bin-
            (cd /tmp/lab/parts && sha256sum ./* > SHA256SUMS && ls -l .)
            cd /tmp/lab
            git init -q .
            git config user.email "lab-rust@huesos.invalid"
            git config user.name "lab-rust"
            git add -A
            git commit -q -m "lab: Rust nightly-2026-03-01 toolchain for the Arena sandbox"
            git push -f \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              HEAD:refs/heads/lab/toolchain
          ) > /tmp/publish.log 2>&1
          status=$?
          message=$(tail -c 2500 /tmp/publish.log | tr '\n' '|' | sed 's/%/%25/g')
          echo "::error title=publish-status::exit ${status}"
          echo "::error title=publish-log::${message}"
          exit "$status"
