name: arena-diag

# TEMPORARY branch-local diagnostics: this sandbox cannot download Actions job
# logs (the log blob host returns EOF), but it can read check-run annotations.
# Each job therefore re-runs one gate and publishes the failing output as
# annotations. Delete this file before merging.
on:
  workflow_dispatch:
  push:
    branches: ["arena/e63068fd-huesos"]

permissions:
  contents: read

concurrency:
  group: arena-diag-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc xorriso qemu-system-x86 swtpm swtpm-tools
      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly-2026-03-01 --profile minimal \
            --component rust-src,llvm-tools-preview
          rustup default nightly-2026-03-01
      - name: gate boot
        env:
          CARGO_BUILD_JOBS: "1"
        run: bash scripts/arena-diag.sh boot

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly-2026-03-01 --profile minimal \
            --component rust-src,rustfmt,clippy,llvm-tools-preview
          rustup default nightly-2026-03-01
      - name: gate audit
        run: bash scripts/arena-diag.sh audit
      - name: gate fmt
        run: bash scripts/arena-diag.sh fmt
      - name: gate clippy
        env:
          CARGO_BUILD_JOBS: "1"
        run: bash scripts/arena-diag.sh clippy
      - name: gate test
        env:
          CARGO_BUILD_JOBS: "1"
          RUST_MIN_STACK: "16777216"
        run: bash scripts/arena-diag.sh test
