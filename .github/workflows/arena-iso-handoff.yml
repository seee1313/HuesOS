name: arena-iso-handoff

# Temporary hand-off workflow for an Arena session whose sandbox cannot reach
# crates.io / static.rust-lang.org. It builds the release ISO on a GitHub
# runner, runs the real boot smoke gate, and publishes the compressed image and
# the serial log back into this branch so the session can fetch them over git.
# Delete this file when the session ends.

on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/arena-iso-handoff.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arena-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly-2026-03-01 --profile minimal \
            --component rust-src,llvm-tools-preview
          rustup default nightly-2026-03-01

      - name: Install ISO and QEMU tooling
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xorriso qemu-system-x86

      - name: Build release kernel + ISO
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          set -o pipefail
          make iso PROFILE=release 2>&1 | tee /tmp/huesos-build.log

      - name: Publish build log when the build failed
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/arena-iso
          cp /tmp/huesos-build.log ci-artifacts/arena-iso/build.log || true
          git config user.name "arena-iso-bot"
          git config user.email "arena-iso-bot@users.noreply.github.com"
          git add -f ci-artifacts/arena-iso/build.log
          git commit -m "chore(arena): publish failed build log [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      # A writable HxFS volume for the interactive storage checks: the same
      # builder the NVMe soak uses, so the guest sees a current-format image.
      - name: Build HxFS fixture image
        run: |
          set -euo pipefail
          python3 tools/mkhxfs.py --output build/nvme.img --blocks 24576
          ls -l build/nvme.img
          xz -T0 -6 -k build/nvme.img
          ls -l build/nvme.img.xz

      - name: Boot smoke gate (release, SMP2, ecam)
        id: smoke
        continue-on-error: true
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          set +e
          bash scripts/ci-qemu-smoke.sh release 2 240 ecam
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect image and boot log
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/arena-iso
          cp ci-artifacts/qemu-release-smp2.log ci-artifacts/arena-iso/qemu-smoke.log || true
          echo "smoke_status=${{ steps.smoke.outputs.status }}" \
            > ci-artifacts/arena-iso/smoke-status.txt
          ls -l build/huesos.iso
          sha256sum build/huesos.iso | tee ci-artifacts/arena-iso/huesos.iso.sha256
          xz -T0 -6 -k build/huesos.iso
          ls -l build/huesos.iso.xz
          if [ "$(stat -c%s build/huesos.iso.xz)" -gt 90000000 ]; then
            split -b 32000000 -d -a 2 build/huesos.iso.xz \
              ci-artifacts/arena-iso/huesos.iso.xz.part
          else
            cp build/huesos.iso.xz ci-artifacts/arena-iso/huesos.iso.xz
          fi
          cp build/nvme.img.xz ci-artifacts/arena-iso/nvme.img.xz
          ls -l ci-artifacts/arena-iso

      - name: Publish image to the branch
        run: |
          set -euo pipefail
          git config user.name "arena-iso-bot"
          git config user.email "arena-iso-bot@users.noreply.github.com"
          git add -f ci-artifacts/arena-iso
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -m "chore(arena): publish built HuesOS release ISO and smoke log [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail when the boot gate failed
        if: steps.smoke.outputs.status != '0' && steps.smoke.outputs.status != '124'
        run: |
          echo "boot smoke gate failed with status ${{ steps.smoke.outputs.status }}" >&2
          tail -200 ci-artifacts/arena-iso/qemu-smoke.log >&2 || true
          exit 1
