[build]
target = "x86_64-huesos.json"

[target.x86_64-huesos]
rustflags = [
    "-C", "link-arg=-Tscripts/linker.ld",
    "-C", "link-arg=-no-pie",
    "-C", "relocation-model=static",
]

[unstable]
# Kernel build commands pass `-Z build-std=core,compiler_builtins,alloc`
# explicitly. Keeping that setting global breaks host tools and libFuzzer by
# rebuilding a second `core` next to host `std`.
json-target-spec = true
