[package]
name = "huesos-driver-host-snd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "huesos-driver-host-snd"
path = "src/main.rs"

[dependencies]
libcanvas = { path = "../libcanvas" }
huesos-abi = { path = "../../huesos-abi" }
huesos-audio = { path = "../../huesos-audio" }

[profile.release]
opt-level = 2
panic = "abort"
lto = false

[profile.dev]
panic = "abort"

[workspace]
