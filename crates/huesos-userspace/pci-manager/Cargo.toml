[features]
default = []
# AP-10 conformance knob: require the legacy CF8/CFC backend for reads.
force-legacy = []

[package]
name = "huesos-pci-manager"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "huesos-pci-manager"
path = "src/main.rs"

[dependencies]
libcanvas = { path = "../libcanvas" }
huesos-abi = { path = "../../huesos-abi" }

[profile.release]
opt-level = 1
panic = "abort"
lto = false

[profile.dev]
panic = "abort"

[workspace]
