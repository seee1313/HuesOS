[package]
name = "huesos-std"
version = "0.1.0"
edition = "2021"

[lib]
name = "huesos_std"
path = "src/lib.rs"

[dependencies]
libcanvas = { path = "../libcanvas", default-features = false, features = ["dyn-client", "thread-tasks"] }
huesos-abi = { path = "../../huesos-abi" }
huesos-fat = { path = "../../huesos-fat" }
spin = { version = "0.9.8", default-features = false, features = ["spin_mutex", "rwlock", "once", "lazy", "barrier"] }

[profile.release]
opt-level = 2
panic = "abort"
lto = false

[profile.dev]
panic = "abort"

[workspace]
