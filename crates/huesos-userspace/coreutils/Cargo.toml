[package]
name = "huesos-coreutils"
version = "0.1.0"
edition = "2021"

[lib]
name = "huesos_coreutils"
path = "src/lib.rs"

[[bin]]
name = "ls"
path = "src/bin/ls.rs"

[[bin]]
name = "cat"
path = "src/bin/cat.rs"

[[bin]]
name = "stat"
path = "src/bin/stat.rs"

[[bin]]
name = "touch"
path = "src/bin/touch.rs"

[[bin]]
name = "mkdir"
path = "src/bin/mkdir.rs"

[[bin]]
name = "rm"
path = "src/bin/rm.rs"

[[bin]]
name = "mv"
path = "src/bin/mv.rs"

[[bin]]
name = "write"
path = "src/bin/write.rs"

[[bin]]
name = "hxfs"
path = "src/bin/hxfs.rs"

[[bin]]
name = "pci"
path = "src/bin/pci.rs"

[[bin]]
name = "lsusb"
path = "src/bin/lsusb.rs"

[[bin]]
name = "acpi"
path = "src/bin/acpi.rs"

[[bin]]
name = "ps"
path = "src/bin/ps.rs"

[[bin]]
name = "schedctl"
path = "src/bin/schedctl.rs"

[[bin]]
name = "btop"
path = "src/bin/btop.rs"

[[bin]]
name = "sleep"
path = "src/bin/sleep.rs"

[[bin]]
name = "std-smoke"
path = "src/bin/std_smoke.rs"

[[bin]]
name = "hexdump"
path = "src/bin/hexdump.rs"

[[bin]]
name = "dd"
path = "src/bin/dd.rs"

[[bin]]
name = "df"
path = "src/bin/df.rs"

[[bin]]
name = "du"
path = "src/bin/du.rs"

[[bin]]
name = "lsblk"
path = "src/bin/lsblk.rs"

[[bin]]
name = "fsck"
path = "src/bin/fsck.rs"

[[bin]]
name = "mkfs"
path = "src/bin/mkfs.rs"

[[bin]]
name = "grep"
path = "src/bin/grep.rs"

[[bin]]
name = "find"
path = "src/bin/find.rs"

[[bin]]
name = "wc"
path = "src/bin/wc.rs"

[[bin]]
name = "head"
path = "src/bin/head.rs"

[[bin]]
name = "tail"
path = "src/bin/tail.rs"

[[bin]]
name = "sort"
path = "src/bin/sort.rs"

[[bin]]
name = "tar"
path = "src/bin/tar.rs"

[[bin]]
name = "sha256sum"
path = "src/bin/sha256sum.rs"

[[bin]]
name = "nano"
path = "src/bin/nano.rs"

[[bin]]
name = "ln"
path = "src/bin/ln.rs"

[[bin]]
name = "cp"
path = "src/bin/cp.rs"

[[bin]]
name = "chmod"
path = "src/bin/chmod.rs"

[[bin]]
name = "readlink"
path = "src/bin/readlink.rs"

[[bin]]
name = "seq"
path = "src/bin/seq.rs"

[[bin]]
name = "uniq"
path = "src/bin/uniq.rs"

[[bin]]
name = "tee"
path = "src/bin/tee.rs"

[[bin]]
name = "basename"
path = "src/bin/basename.rs"

[[bin]]
name = "dirname"
path = "src/bin/dirname.rs"

[[bin]]
name = "ping"
path = "src/bin/ping.rs"

[[bin]]
name = "curl"
path = "src/bin/curl.rs"

[[bin]]
name = "netctl"
path = "src/bin/netctl.rs"

[[bin]]
name = "wlanctl"
path = "src/bin/wlanctl.rs"

[dependencies]
libcanvas = { path = "../libcanvas", default-features = false, features = ["dyn-client"] }
huesos-abi = { path = "../../huesos-abi" }
huesos-std = { path = "../huesos-std" }
huesos-gpt = { path = "../../huesos-gpt" }
huesos-hxfs = { path = "../../huesos-hxfs", features = ["writer"] }
huesos-tls = { path = "../../huesos-tls" }
spin = "0.9.9"

[profile.release]
opt-level = 2
panic = "abort"
lto = false

[profile.dev]
panic = "abort"

[workspace]
