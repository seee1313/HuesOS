[package]
name = "huesos-coreutils"
version = "0.1.0"
edition = "2021"

[lib]
name = "huesos_coreutils"
path = "src/lib.rs"

[[bin]]
name = "ls"
path = "src/bin/ls.rs"

[[bin]]
name = "cat"
path = "src/bin/cat.rs"

[[bin]]
name = "stat"
path = "src/bin/stat.rs"

[[bin]]
name = "touch"
path = "src/bin/touch.rs"

[[bin]]
name = "mkdir"
path = "src/bin/mkdir.rs"

[[bin]]
name = "rm"
path = "src/bin/rm.rs"

[[bin]]
name = "mv"
path = "src/bin/mv.rs"

[[bin]]
name = "write"
path = "src/bin/write.rs"

[[bin]]
name = "hxfs"
path = "src/bin/hxfs.rs"

[[bin]]
name = "pci"
path = "src/bin/pci.rs"

[[bin]]
name = "acpi"
path = "src/bin/acpi.rs"

[[bin]]
name = "ps"
path = "src/bin/ps.rs"

[[bin]]
name = "sleep"
path = "src/bin/sleep.rs"

[[bin]]
name = "std-smoke"
path = "src/bin/std_smoke.rs"

[[bin]]
name = "hexdump"
path = "src/bin/hexdump.rs"

[[bin]]
name = "dd"
path = "src/bin/dd.rs"

[[bin]]
name = "df"
path = "src/bin/df.rs"

[[bin]]
name = "du"
path = "src/bin/du.rs"

[[bin]]
name = "lsblk"
path = "src/bin/lsblk.rs"

[[bin]]
name = "fsck"
path = "src/bin/fsck.rs"

[[bin]]
name = "mkfs"
path = "src/bin/mkfs.rs"

[dependencies]
libcanvas = { path = "../libcanvas", default-features = false, features = ["dyn-client"] }
huesos-abi = { path = "../../huesos-abi" }
huesos-std = { path = "../huesos-std" }
huesos-gpt = { path = "../../huesos-gpt" }
huesos-hxfs = { path = "../../huesos-hxfs", features = ["writer"] }

[profile.release]
opt-level = 2
panic = "abort"
lto = false

[profile.dev]
panic = "abort"

[workspace]
