[package]
name = "huesos-uacpi-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
huesos-abi = { path = "../../huesos-abi" }
libcanvas = { path = "../libcanvas" }
spin = "0.9"

[build-dependencies]
cc = "1.2"

[profile.release]
opt-level = 2
panic = "abort"
lto = false

[profile.dev]
panic = "abort"

[workspace]
