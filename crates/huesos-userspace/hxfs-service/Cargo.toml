[package]
name = "huesos-hxfs-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "huesos-hxfs-service"
path = "src/main.rs"

[dependencies]
libcanvas = { path = "../libcanvas" }
huesos-abi = { path = "../../huesos-abi" }
huesos-hxfs = { path = "../../huesos-hxfs" }
huesos-user-alloc = { path = "../../huesos-user-alloc" }

[profile.release]
opt-level = 2
panic = "abort"
lto = false

[profile.dev]
panic = "abort"

[workspace]
