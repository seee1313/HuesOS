[package]
name = "huesos-hxfs-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "huesos-hxfs-service"
path = "src/main.rs"

[dependencies]
libcanvas = { path = "../libcanvas" }
huesos-abi = { path = "../../huesos-abi" }
huesos-hxfs = { path = "../../huesos-hxfs" }

[features]
# Stage B.5 test wiring (never enabled in a production build):
# mounts encrypted+compressed volumes with the synthetic key
# context and runs the boot self-check that the qemu-nvme soak
# asserts on. The Stage D TPM-backed KeyProvider replaces this
# whole path. Enabled by the soak harness via
# HUESOS_HXFS_SERVICE_FEATURES (see huesos-kernel/build.rs).
synthetic-key = [
    "huesos-hxfs/crypto-aes-gcm",
    "huesos-hxfs/compression-engines",
    "huesos-hxfs/hxblob",
]

[profile.release]
opt-level = 2
panic = "abort"
lto = false

[profile.dev]
panic = "abort"

[workspace]
