[package]
name = "huesos-hxfs-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "huesos-hxfs-service"
path = "src/main.rs"

[dependencies]
libcanvas = { path = "../libcanvas" }
huesos-abi = { path = "../../huesos-abi" }
huesos-hxfs = { path = "../../huesos-hxfs" }
huesos-hxfs-proto = { path = "../../huesos-hxfs-proto" }

[features]
default = ["production"]
# The production service always contains the audited crypto/compression engines
# and Hxblob protocol. On-disk policy roots decide whether a volume uses them;
# build features are never a mount-policy source.
production = [
    "huesos-hxfs/crypto-aes-gcm",
    "huesos-hxfs/compression-engines",
    "hxblob",
]
# Hxblob content-addressed object store: the native BlobView
# protocol operations (OpenBlob/CreateBlob and the read-only view
# handle). Separate from `synthetic-key` because this is a
# production capability, not test wiring -- `synthetic-key` merely
# turns it on for the soak image as well.
hxblob = ["huesos-hxfs/hxblob"]
# Stage B.5 test wiring (never enabled in a production build):
# mounts encrypted+compressed volumes with the synthetic key
# context and runs the boot self-check that the qemu-nvme soak
# asserts on. The Stage D TPM-backed KeyProvider replaces this
# whole path. Enabled by the soak harness via
# HUESOS_HXFS_SERVICE_FEATURES (see huesos-kernel/build.rs).
synthetic-key = ["production"]

[profile.release]
opt-level = 2
panic = "abort"
lto = false

[profile.dev]
panic = "abort"

[workspace]
