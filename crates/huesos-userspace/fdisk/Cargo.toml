[package]
name = "huesos-fdisk"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "huesos-fdisk"
path = "src/main.rs"

[dependencies]
libcanvas = { path = "../libcanvas", default-features = false, features = ["dyn-client"] }
huesos-abi = { path = "../../huesos-abi" }
huesos-gpt = { path = "../../huesos-gpt" }

[profile.release]
opt-level = 2
panic = "abort"
lto = false

[profile.dev]
panic = "abort"

[workspace]
