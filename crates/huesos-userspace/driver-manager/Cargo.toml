[package]
name = "huesos-driver-manager"
version = "0.1.0"
edition = "2021"

[features]
default = []
acpi-restart-smoke = []
acpi-restart-budget-smoke = []
key-broker-fail-smoke = []
# AP-10 conformance knob: mint the legacy CF8/CFC authority instead of
# ECAM windows and announce the legacy backend in the PCI manager hello.
pci-force-legacy = []

[[bin]]
name = "huesos-driver-manager"
path = "src/main.rs"

[dependencies]
libcanvas = { path = "../libcanvas" }
huesos-abi = { path = "../../huesos-abi" }
huesos-blobfs = { path = "../../huesos-blobfs" }

[profile.release]
opt-level = 1
panic = "abort"
lto = false

[profile.dev]
panic = "abort"

[workspace]
