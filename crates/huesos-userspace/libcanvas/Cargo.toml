[package]
name = "libcanvas"
version = "0.1.0"
edition = "2021"

[features]
default = ["local-heap"]
# Embed `huesos-scudo` directly in this crate (used by static services and libcanvas.so).
local-heap = ["dep:huesos-scudo"]
# Export stable C ABI symbols + global allocator + `.init_array` constructor for `libcanvas.so`.
c-abi = ["local-heap"]
# Thin Rust client wrapper forwarding syscalls and heap allocations to `libcanvas.so`.
dyn-client = []
# Boot-time negative syscall probes used by huesos-init/QEMU smoke tests.
kernel-smoke-tests = []

[dependencies]
huesos-abi = { path = "../../huesos-abi" }
huesos-elf = { path = "../../huesos-elf" }
huesos-scudo = { path = "../../huesos-scudo", optional = true }
huesos-blobfs = { path = "../../huesos-blobfs" }
# Pinned directly, not inherited: `huesos-std` builds this crate inside its own
# workspace, where the root workspace's dependency table does not exist. The
# feature list is minimal on purpose: `lock_api` (a default feature) is a
# separate crate we do not need, and every feature here is one `huesos-std`
# layers policy on top of.
spin = { version = "0.9.8", default-features = false, features = ["spin_mutex", "rwlock", "once", "lazy", "barrier"] }

[profile.release]
opt-level = 2
panic = "abort"
lto = false

[profile.dev]
panic = "abort"

[workspace]
